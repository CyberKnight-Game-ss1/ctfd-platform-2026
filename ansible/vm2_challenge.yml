---
- name: Configure VM2 (Challenge Server)
  hosts: vm2_challenge
  become: yes
  vars:
    k3s_version: "v1.28.2+k3s1"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - tcpdump
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - apparmor
          - apparmor-utils
        state: present

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Run docker-socket-proxy with mTLS
      docker_container:
        name: docker-proxy
        image: tecnativa/docker-socket-proxy
        state: started
        restart_policy: always
        privileged: true
        ports:
          - "2376:2376"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /etc/docker/certs.d:/run/secrets:ro
        env:
          CONTAINERS: "1"
          POST: "0"
          START: "1"
          STOP: "1"
          RESTART: "1"
          INFO: "1"
          # Require TLS and setup certs
          TLS_CERT_PATH: /run/secrets/server-cert.pem
          TLS_KEY_PATH: /run/secrets/server-key.pem
          TLS_CA_PATH: /run/secrets/ca.pem
          REQUIRE_TLS: "1"
          # Only bind to internal IP (Terraform will set this, but we can bind 0.0.0.0 because GCP Firewall blocks external)
          # Better yet, bind to specific interface if known, but 0.0.0.0 is safe given GCP firewall + mTLS.

    - name: Setup tcpdump script for packet capture
      copy:
        dest: /usr/local/bin/capture_ctf_traffic.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Capture traffic on docker0 interface. Rotate every 30 mins, keep max 48 files (24h)
          mkdir -p /var/log/ctf-pcap
          tcpdump -i docker0 -w /var/log/ctf-pcap/%Y%m%d-%H%M%S.pcap -G 1800 -W 48

    - name: Create systemd service for tcpdump
      copy:
        dest: /etc/systemd/system/ctf-tcpdump.service
        content: |
          [Unit]
          Description=CTF Packet Capture
          After=network.target docker.service

          [Service]
          ExecStart=/usr/local/bin/capture_ctf_traffic.sh
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start tcpdump service
      systemd:
        name: ctf-tcpdump
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Install K3s (Lightweight Kubernetes for Phase 3)
      shell: "curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -"
      args:
        creates: /usr/local/bin/k3s
        
    - name: Wait for K3s node to be ready
      shell: "k3s kubectl get nodes | grep ' Ready'"
      register: k3s_ready
      retries: 10
      delay: 5
      until: k3s_ready.rc == 0
