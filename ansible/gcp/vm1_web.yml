---
- name: Configure VM1 - Web Server (GCP)
  hosts: vm1_web
  become: yes
  vars:
    ctfd_dir: /opt/ctfd

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - nginx
          - docker.io
          - docker-compose
          - python3-pip
        state: present

    - name: Create CTFd directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "1001"
        group: "1001"
        mode: '0755'
      with_items:
        - "{{ ctfd_dir }}"
        - "{{ ctfd_dir }}/themes"
        - "{{ ctfd_dir }}/uploads"    # QUAN TRỌNG: phải thuộc UID 1001 (user ctfd trong container)
        - "{{ ctfd_dir }}/logs"
        - "{{ ctfd_dir }}/redis"

    - name: Copy custom themes
      copy:
        src: ../../themes/
        dest: "{{ ctfd_dir }}/themes/"

    - name: Create docker-compose.yml cho CTFd + Redis
      copy:
        dest: "{{ ctfd_dir }}/docker-compose.yml"
        content: |
          version: '3'
          services:
            ctfd:
              image: ctfd/ctfd:latest
              restart: always
              ports:
                - "8000:8000"
              environment:
                - SECRET_KEY={{ ctfd_secret_key | default('change_me_in_production') }}
                - UPLOAD_FOLDER=/var/uploads
                - DATABASE_URL=${DATABASE_URL}
                - REDIS_URL=redis://cache:6379
                - WORKERS=4
                - LOG_FOLDER=/var/log/CTFd
                - ACCESS_LOG=-
                - ERROR_LOG=-
                - REVERSE_PROXY=True
              volumes:
                - {{ ctfd_dir }}/logs:/var/log/CTFd
                - {{ ctfd_dir }}/uploads:/var/uploads
                - {{ ctfd_dir }}/themes/ctfd-theme-neubrutalism:/opt/CTFd/CTFd/themes/ctfd-theme-neubrutalism
              depends_on:
                - cache

            cache:
              image: redis:4
              restart: always
              volumes:
                - {{ ctfd_dir }}/redis:/data

            worker:
              build: .
              user: root
              restart: always
              command: ["opt/CTFd/ping.sh", "redis:6379", "worker"]
              environment:
                - SECRET_KEY={{ ctfd_secret_key | default('change_me_in_production') }}
                - UPLOAD_FOLDER=/var/uploads
                - DATABASE_URL=${DATABASE_URL}
                - REDIS_URL=redis://cache:6379
                - WORKERS=1
                - LOG_FOLDER=/var/log/CTFd
                - ACCESS_LOG=-
                - ERROR_LOG=-
                - REVERSE_PROXY=True
              volumes:
                - {{ ctfd_dir }}/logs:/var/log/CTFd
                - {{ ctfd_dir }}/uploads:/var/uploads
              depends_on:
                - ctfd
                - cache

    # Lấy DATABASE_URL từ GCP Secret Manager
    - name: Lấy DATABASE_URL từ GCP Secret Manager
      shell: >
        gcloud secrets versions access latest --secret="ctfd-db-connection"
      register: db_url_result
      when: db_url is not defined

    - name: Set db_url từ Secret Manager nếu chưa có
      set_fact:
        db_url: "{{ db_url_result.stdout }}"
      when: db_url is not defined and db_url_result is defined

    - name: Start CTFd via docker-compose
      shell: "DATABASE_URL='{{ db_url }}' docker-compose up -d"
      args:
        chdir: "{{ ctfd_dir }}"

    - name: Configure Nginx as Reverse Proxy
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              client_max_body_size 200M;

              # Proxy to CTFd
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes

    # Google Cloud Ops Agent dùng để đẩy Nginx logs về Cloud Logging
    - name: Install Google Cloud Ops Agent
      shell: >
        curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh &&
        bash add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /opt/google-cloud-ops-agent/bin/google_cloud_ops_agent_engine
